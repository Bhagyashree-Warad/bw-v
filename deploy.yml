name: Deploy static BMW site

on:
  push:
    branches: ["test"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: azure/webapps-deploy@v2
        with:
          app-name: "bm-v-webapp"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: "."
